<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar-t" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#888888"/></marker>
    <marker id="ar-o2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e8833a"/></marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">overlap 时间线（window=16）：CPU 段藏进 kernel 段，一窗一次 sync</text>

  <!-- lane labels -->
  <text x="40" y="148" font-size="13" font-weight="bold" fill="#555">Host</text>
  <text x="30" y="252" font-size="13" font-weight="bold" fill="#555">Device</text>
  <text x="30" y="268" font-size="13" font-weight="bold" fill="#555">主流</text>
  <text x="30" y="362" font-size="13" font-weight="bold" fill="#555">Device</text>
  <text x="30" y="378" font-size="13" font-weight="bold" fill="#555">旁流</text>
  <line x1="110" y1="190" x2="960" y2="190" stroke="#dddddd" stroke-dasharray="4,4"/>
  <line x1="110" y1="305" x2="960" y2="305" stroke="#dddddd" stroke-dasharray="4,4"/>

  <text x="120" y="106" font-size="11" fill="#888">每迭代：launch kernel → CPU gather → 排队旁流 H2D+scatter（host 不等设备）</text>

  <!-- host blocks: iter i -->
  <rect x="120" y="120" width="26" height="40" fill="#2e6fb7"/>
  <rect x="146" y="120" width="60" height="40" fill="#e8833a"/>
  <text x="152" y="144" font-size="11" fill="#ffffff">gatherᵢ</text>
  <rect x="206" y="120" width="26" height="40" fill="#f0b27a"/>
  <!-- iter i+1 -->
  <rect x="238" y="120" width="26" height="40" fill="#2e6fb7"/>
  <rect x="264" y="120" width="60" height="40" fill="#e8833a"/>
  <text x="270" y="144" font-size="11" fill="#ffffff">gatherᵢ₊₁</text>
  <rect x="324" y="120" width="26" height="40" fill="#f0b27a"/>
  <!-- iter i+2 -->
  <rect x="356" y="120" width="26" height="40" fill="#2e6fb7"/>
  <rect x="382" y="120" width="60" height="40" fill="#e8833a"/>
  <text x="388" y="144" font-size="11" fill="#ffffff">gatherᵢ₊₂</text>
  <rect x="442" y="120" width="26" height="40" fill="#f0b27a"/>
  <text x="478" y="145" font-size="14" fill="#999">……</text>
  <!-- last iter -->
  <rect x="520" y="120" width="26" height="40" fill="#2e6fb7"/>
  <rect x="546" y="120" width="60" height="40" fill="#e8833a"/>
  <text x="550" y="144" font-size="11" fill="#ffffff">gatherᵢ₊₁₅</text>
  <rect x="606" y="120" width="26" height="40" fill="#f0b27a"/>

  <!-- device main stream: kernels back to back -->
  <rect x="150" y="230" width="150" height="40" fill="#2e6fb7"/>
  <text x="158" y="254" font-size="11" fill="#ffffff">kernelᵢ（90% 行）</text>
  <rect x="300" y="230" width="150" height="40" fill="#2e6fb7"/>
  <text x="308" y="254" font-size="11" fill="#ffffff">kernelᵢ₊₁</text>
  <rect x="450" y="230" width="150" height="40" fill="#2e6fb7"/>
  <text x="458" y="254" font-size="11" fill="#ffffff">kernelᵢ₊₂</text>
  <text x="610" y="255" font-size="14" fill="#999">……</text>
  <rect x="640" y="230" width="150" height="40" fill="#2e6fb7"/>
  <text x="648" y="254" font-size="11" fill="#ffffff">kernelᵢ₊₁₅</text>

  <!-- device side stream: H2D + scatter -->
  <rect x="215" y="340" width="50" height="40" fill="#e8833a"/>
  <text x="222" y="364" font-size="11" fill="#ffffff">H2D</text>
  <rect x="265" y="340" width="35" height="40" fill="#c0392b"/>
  <text x="269" y="364" font-size="11" fill="#ffffff">sc</text>
  <rect x="335" y="340" width="50" height="40" fill="#e8833a"/>
  <text x="342" y="364" font-size="11" fill="#ffffff">H2D</text>
  <rect x="385" y="340" width="35" height="40" fill="#c0392b"/>
  <text x="389" y="364" font-size="11" fill="#ffffff">sc</text>
  <rect x="450" y="340" width="50" height="40" fill="#e8833a"/>
  <text x="457" y="364" font-size="11" fill="#ffffff">H2D</text>
  <rect x="500" y="340" width="35" height="40" fill="#c0392b"/>
  <text x="504" y="364" font-size="11" fill="#ffffff">sc</text>
  <text x="545" y="365" font-size="14" fill="#999">……</text>
  <rect x="700" y="340" width="50" height="40" fill="#e8833a"/>
  <text x="707" y="364" font-size="11" fill="#ffffff">H2D</text>
  <rect x="750" y="340" width="35" height="40" fill="#c0392b"/>
  <text x="754" y="364" font-size="11" fill="#ffffff">sc</text>

  <!-- dependency arrows gather -> H2D -->
  <line x1="176" y1="160" x2="240" y2="340" stroke="#e8833a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-o2)"/>
  <line x1="294" y1="160" x2="360" y2="340" stroke="#e8833a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-o2)"/>

  <!-- annotations -->
  <text x="560" y="212" font-size="12" fill="#2b7a46">CPU gather 与 kernel 并发 ⇒ CPU 段被藏住</text>
  <text x="400" y="332" font-size="11" fill="#c0392b">H2D+scatter 与后续 kernel 并发</text>

  <!-- time markers -->
  <line x1="120" y1="100" x2="120" y2="445" stroke="#999999" stroke-dasharray="5,4"/>
  <text x="112" y="94" font-size="11" fill="#666">t0</text>
  <line x1="640" y1="100" x2="640" y2="445" stroke="#999999" stroke-dasharray="5,4"/>
  <text x="646" y="112" font-size="11" fill="#666">t1：host 发射完全窗</text>
  <line x1="800" y1="100" x2="800" y2="445" stroke="#c0392b" stroke-dasharray="5,4"/>
  <text x="806" y="112" font-size="12" fill="#c0392b">t2：一窗一次 sync</text>

  <!-- brackets -->
  <line x1="120" y1="455" x2="640" y2="455" stroke="#555" stroke-width="1.2"/>
  <line x1="120" y1="450" x2="120" y2="460" stroke="#555" stroke-width="1.2"/>
  <line x1="640" y1="450" x2="640" y2="460" stroke="#555" stroke-width="1.2"/>
  <text x="380" y="476" text-anchor="middle" font-size="12" fill="#333">launch_to_gather_done（host：发射 + gather 全窗）</text>
  <line x1="640" y1="490" x2="800" y2="490" stroke="#555" stroke-width="1.2"/>
  <line x1="640" y1="485" x2="640" y2="495" stroke="#555" stroke-width="1.2"/>
  <line x1="800" y1="485" x2="800" y2="495" stroke="#555" stroke-width="1.2"/>
  <text x="720" y="512" text-anchor="middle" font-size="12" fill="#333">tail（等设备 drained）</text>

  <!-- time axis -->
  <line x1="120" y1="540" x2="955" y2="540" stroke="#888888" stroke-width="1.2" marker-end="url(#ar-t)"/>
  <text x="925" y="558" font-size="11" fill="#888">时间</text>

  <text x="500" y="572" text-anchor="middle" font-size="11" fill="#777">R6c bs24/copy300 绑定 per-iter：launch_to_gather_done 172.0µs ｜ tail 38.6µs ｜ kernel_event 202.5µs ｜ 全程 210.0µs ｜ window 化使固定开销 −94%（R3）</text>
</svg>
