<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e6fb7"/></marker>
    <marker id="ar-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e8833a"/></marker>
    <marker id="ar-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#999999"/></marker>
  </defs>

  <text x="500" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">hybrid 数据通路（cf=0.1）：90% 行走 kernel 直读，10% 行走 CPU gather + 大块 H2D</text>

  <!-- zones -->
  <rect x="20" y="60" width="430" height="540" rx="10" fill="#f7f7f9" stroke="#bbbbbb"/>
  <text x="40" y="90" font-size="15" font-weight="bold" fill="#333">Host（CPU + DRAM）</text>
  <rect x="450" y="60" width="120" height="540" fill="#fff8ec" stroke="#e0c890" stroke-dasharray="6,4"/>
  <text x="512" y="330" font-size="13" fill="#b08a3c" text-anchor="middle" transform="rotate(-90 512 330)">PCIe 总线</text>
  <rect x="570" y="60" width="410" height="540" rx="10" fill="#f7f7f9" stroke="#bbbbbb"/>
  <text x="590" y="90" font-size="15" font-weight="bold" fill="#333">Device（NPU · HBM）</text>

  <!-- host boxes -->
  <rect x="50" y="110" width="220" height="80" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="62" y="136" font-size="13" fill="#333">DRAM 池镜像（只读源池）</text>
  <text x="62" y="158" font-size="11" fill="#666">每 token 一行 656B · 离散随机</text>
  <text x="62" y="176" font-size="11" fill="#666">设备侧为真 swapped 内存</text>

  <rect x="285" y="330" width="160" height="100" rx="6" fill="#ffffff" stroke="#888888" stroke-dasharray="4,3"/>
  <text x="297" y="352" font-size="12" fill="#333">copy plan 行级切分</text>
  <rect x="295" y="362" width="120" height="14" fill="#2e6fb7"/>
  <rect x="415" y="362" width="13" height="14" fill="#e8833a"/>
  <text x="295" y="392" font-size="10" fill="#2e6fb7">90% → kernel</text>
  <text x="372" y="392" font-size="10" fill="#e8833a">10% → CPU</text>
  <text x="297" y="416" font-size="10" fill="#888">cf=0.1 · host 侧 metadata</text>

  <rect x="50" y="330" width="220" height="80" rx="6" fill="#ffffff" stroke="#e8833a"/>
  <text x="62" y="356" font-size="13" font-weight="bold" fill="#c0692b">CPU gather</text>
  <text x="62" y="376" font-size="11" fill="#444">index_select · 8 线程</text>
  <text x="62" y="394" font-size="11" fill="#444">本机 DRAM 读 → staging</text>

  <rect x="50" y="460" width="220" height="70" rx="6" fill="#ffffff" stroke="#e8833a"/>
  <text x="62" y="486" font-size="13" fill="#333">pinned staging[slot]</text>
  <text x="62" y="508" font-size="11" fill="#666">窗内每迭代独占一槽（w=16）</text>

  <!-- device boxes -->
  <rect x="610" y="110" width="340" height="90" rx="6" fill="#eef4fb" stroke="#2e6fb7"/>
  <text x="625" y="138" font-size="13" font-weight="bold" fill="#245a91">scatter_copy_c8 kernel（主流）</text>
  <text x="625" y="162" font-size="11" fill="#444">按前缀 plan 逐行随机读 DRAM → 写 HBM</text>
  <text x="625" y="182" font-size="11" fill="#666">行数 = 90%（前缀裁剪，ABI 不变）</text>

  <rect x="710" y="300" width="240" height="60" rx="6" fill="#fdf2e9" stroke="#e8833a"/>
  <text x="725" y="326" font-size="13" fill="#333">staging_npu[slot]</text>
  <text x="725" y="346" font-size="11" fill="#666">设备侧缓冲</text>

  <rect x="710" y="395" width="240" height="60" rx="6" fill="#ffffff" stroke="#e8833a"/>
  <text x="722" y="420" font-size="12" fill="#333">index_copy_ 散到目标槽（旁流）</text>
  <text x="722" y="442" font-size="11" fill="#666">HBM 内部 · 不走 PCIe</text>

  <rect x="610" y="520" width="340" height="70" rx="6" fill="#eaf7ee" stroke="#3a9e5c"/>
  <text x="625" y="548" font-size="13" font-weight="bold" fill="#2b7a46">HBM KV cache 目标槽</text>
  <text x="625" y="570" font-size="11" fill="#666">两段汇合 · 字节一致校验（correctness）</text>

  <!-- arrows: kernel path (blue) -->
  <line x1="270" y1="150" x2="610" y2="150" stroke="#2e6fb7" stroke-width="3" marker-end="url(#ar-b)"/>
  <text x="300" y="138" font-size="11" fill="#2e6fb7">前 90% 行：逐行 656B 随机读</text>
  <line x1="645" y1="200" x2="645" y2="520" stroke="#2e6fb7" stroke-width="2.5" marker-end="url(#ar-b)"/>
  <text x="653" y="375" font-size="11" fill="#2e6fb7">逐行写 HBM 槽</text>

  <!-- arrows: cpu path (orange) -->
  <line x1="100" y1="190" x2="100" y2="330" stroke="#e8833a" stroke-width="2.5" marker-end="url(#ar-o)"/>
  <text x="108" y="246" font-size="11" fill="#c0692b">尾 10% 行：本机内存读</text>
  <text x="108" y="262" font-size="11" fill="#c0692b">（不走 PCIe）</text>
  <line x1="160" y1="410" x2="160" y2="460" stroke="#e8833a" stroke-width="2.5" marker-end="url(#ar-o)"/>
  <line x1="270" y1="495" x2="710" y2="330" stroke="#e8833a" stroke-width="3" marker-end="url(#ar-o)"/>
  <text x="430" y="408" font-size="12" font-weight="bold" fill="#c0692b">一次连续大块 H2D</text>
  <line x1="830" y1="360" x2="830" y2="395" stroke="#e8833a" stroke-width="2.5" marker-end="url(#ar-o)"/>
  <line x1="830" y1="455" x2="830" y2="520" stroke="#e8833a" stroke-width="2.5" marker-end="url(#ar-o)"/>

  <!-- arrows: metadata (gray dashed) -->
  <path d="M240,190 L240,310 L365,310 L365,330" stroke="#999999" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#ar-g)"/>
  <text x="248" y="240" font-size="10" fill="#888">copy plan</text>
  <text x="248" y="256" font-size="10" fill="#888">三件套</text>
  <line x1="285" y1="370" x2="270" y2="370" stroke="#e8833a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-o)"/>

  <!-- legend -->
  <line x1="50" y1="630" x2="90" y2="630" stroke="#2e6fb7" stroke-width="3"/>
  <text x="98" y="634" font-size="12" fill="#333">kernel 路径（设备主流）</text>
  <line x1="300" y1="630" x2="340" y2="630" stroke="#e8833a" stroke-width="3"/>
  <text x="348" y="634" font-size="12" fill="#333">CPU 路径（旁流并发）</text>
  <line x1="560" y1="630" x2="600" y2="630" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="608" y="634" font-size="12" fill="#333">metadata 切分（host 侧，零设备改动）</text>
  <text x="500" y="664" text-anchor="middle" font-size="12" fill="#777">R6e bs32/copy300 实测：纯 npu 167.99 → hybrid 绑定 181.91 GB/s（+8.3%）；copy≥300 档增益 +8.2~10.5%</text>
</svg>
