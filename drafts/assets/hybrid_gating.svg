<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <text x="490" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">R6e 实测：hybrid 的甜区与门控（cards8 / bs32 / 绑定态，n=3 均值）</text>

  <!-- shaded regions -->
  <rect x="90" y="60" width="320" height="350" fill="#fdecea" opacity="0.6"/>
  <text x="110" y="86" font-size="13" font-weight="bold" fill="#c0392b">门控区：miss 数 &lt; 阈值 ⇒ 纯 kernel</text>
  <rect x="410" y="60" width="520" height="350" fill="#eaf7ee" opacity="0.5"/>
  <text x="700" y="86" font-size="13" font-weight="bold" fill="#2b7a46">甜区：+8~10.5%</text>

  <!-- gridlines: y = 100/125/150/175/200 -->
  <line x1="90" y1="351.7" x2="930" y2="351.7" stroke="#e5e5e5"/>
  <line x1="90" y1="278.8" x2="930" y2="278.8" stroke="#e5e5e5"/>
  <line x1="90" y1="205.8" x2="930" y2="205.8" stroke="#e5e5e5"/>
  <line x1="90" y1="132.9" x2="930" y2="132.9" stroke="#e5e5e5"/>
  <line x1="90" y1="60" x2="930" y2="60" stroke="#e5e5e5"/>
  <text x="62" y="356" font-size="11" fill="#888">100</text>
  <text x="62" y="283" font-size="11" fill="#888">125</text>
  <text x="62" y="210" font-size="11" fill="#888">150</text>
  <text x="62" y="137" font-size="11" fill="#888">175</text>
  <text x="62" y="64" font-size="11" fill="#888">200</text>

  <!-- axes -->
  <line x1="90" y1="60" x2="90" y2="410" stroke="#555"/>
  <line x1="90" y1="410" x2="930" y2="410" stroke="#555"/>
  <text x="30" y="235" font-size="13" fill="#555" text-anchor="middle" transform="rotate(-90 30 235)">折叠带宽 GB/s</text>

  <!-- crossover marker -->
  <line x1="410" y1="60" x2="410" y2="410" stroke="#c0392b" stroke-dasharray="6,4"/>
  <text x="418" y="400" font-size="11" fill="#c0392b">交叉点 ≈200–300（R8 标定）</text>

  <!-- npu line -->
  <polyline points="130,132.4 317,138.6 505,153.4 692,162.6 880,168.4" fill="none" stroke="#2e6fb7" stroke-width="2.5"/>
  <circle cx="130" cy="132.4" r="4" fill="#2e6fb7"/>
  <circle cx="317" cy="138.6" r="4" fill="#2e6fb7"/>
  <circle cx="505" cy="153.4" r="4" fill="#2e6fb7"/>
  <circle cx="692" cy="162.6" r="4" fill="#2e6fb7"/>
  <circle cx="880" cy="168.4" r="4" fill="#2e6fb7"/>
  <text x="112" y="122" font-size="11" fill="#2e6fb7">175.2</text>
  <text x="308" y="156" font-size="11" fill="#2e6fb7">173.0</text>
  <text x="496" y="171" font-size="11" fill="#2e6fb7">168.0</text>
  <text x="683" y="180" font-size="11" fill="#2e6fb7">164.8</text>
  <text x="862" y="186" font-size="11" fill="#2e6fb7">162.8</text>

  <!-- hybrid line -->
  <polyline points="130,350.8 317,131.0 505,112.8 692,112.0 880,129.4" fill="none" stroke="#e8833a" stroke-width="2.5"/>
  <circle cx="130" cy="350.8" r="4" fill="#e8833a"/>
  <circle cx="317" cy="131.0" r="4" fill="#e8833a"/>
  <circle cx="505" cy="112.8" r="4" fill="#e8833a"/>
  <circle cx="692" cy="112.0" r="4" fill="#e8833a"/>
  <circle cx="880" cy="129.4" r="4" fill="#e8833a"/>
  <text x="112" y="372" font-size="11" font-weight="bold" fill="#c0392b">100.3 异常</text>
  <text x="308" y="120" font-size="11" fill="#e8833a">175.7</text>
  <text x="496" y="102" font-size="11" fill="#e8833a">181.9</text>
  <text x="683" y="101" font-size="11" fill="#e8833a">182.2</text>
  <text x="862" y="118" font-size="11" fill="#e8833a">176.2</text>

  <!-- cpu line (dashed, context) -->
  <polyline points="130,191.9 317,136.4 505,142.4 692,182.0 880,307.5" fill="none" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7,4"/>
  <circle cx="130" cy="191.9" r="3.5" fill="#7fb3d5"/>
  <circle cx="880" cy="307.5" r="3.5" fill="#7fb3d5"/>
  <text x="112" y="208" font-size="11" fill="#7fb3d5">154.8</text>
  <text x="862" y="324" font-size="11" fill="#7fb3d5">115.1 塌陷</text>

  <!-- x labels -->
  <text x="121" y="432" font-size="12" fill="#555">100</text>
  <text x="308" y="432" font-size="12" fill="#555">200</text>
  <text x="496" y="432" font-size="12" fill="#555">300</text>
  <text x="683" y="432" font-size="12" fill="#555">500</text>
  <text x="868" y="432" font-size="12" fill="#555">2048</text>
  <text x="490" y="458" text-anchor="middle" font-size="12" fill="#777">copy 数（每请求 miss token 数，横轴非线性）</text>

  <!-- legend -->
  <line x1="180" y1="496" x2="215" y2="496" stroke="#2e6fb7" stroke-width="2.5"/>
  <text x="222" y="500" font-size="12" fill="#333">npu kernel</text>
  <line x1="330" y1="496" x2="365" y2="496" stroke="#e8833a" stroke-width="2.5"/>
  <text x="372" y="500" font-size="12" fill="#333">hybrid（cf=0.1 绑定）</text>
  <line x1="540" y1="496" x2="575" y2="496" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="582" y="500" font-size="12" fill="#333">cpu（绑定，对照）</text>
  <text x="740" y="500" font-size="11" fill="#999">copy100 异常 = overlap 固定开销主导</text>
</svg>
